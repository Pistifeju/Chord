[package]
name = "chord-ios"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2.191"
md-5 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSGraphics", "NSFont", "NSFontDescriptor", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry", "NSString", "NSUUID", "NSValue"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAAnimation", "CABase", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAShapeLayer", "CATextLayer", "CATransform3D", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chord-core = { version = "0.1.0", path = "../chord-core" }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
