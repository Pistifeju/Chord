# Runs the TypeScript checks and the repo rules on Linux for every pull request and every push to main.
name: check-ts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels an outdated pull request run; every push to main runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: sh scripts/check-rules.sh
      - run: node --test "src/**/*.test.ts"
