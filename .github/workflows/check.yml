# Runs npm run check on every pull request and every push to main.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels an outdated pull request run; every push to main runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # check.sh writes the full output to a temp log; print it when a step fails.
      - run: npm run check || { cat "$TMPDIR"/chord-check*; exit 1; }
