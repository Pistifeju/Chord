# Builds, signs and notarizes Chord when a version tag is pushed, then publishes the disk image, the update archive and the update feed as a GitHub Release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # shortcut: the runner is Apple Silicon, so the disk image holds an arm64 build only; add a universal target when an Intel user asks.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in Cargo.toml
        run: |
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || {
            echo "Tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build, sign and notarize
        # The update archive is built here alone, so a build on a contributor's Mac needs no update key.
        run: npm run tauri build -- --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # With a secret missing, Tauri builds an unsigned app and exits 0. This keeps that build from shipping.
      - name: Check the app is notarized
        run: xcrun stapler validate target/release/bundle/macos/Chord.app
      # Tauri only warns when the key that signed the archive is not the one the app trusts, and every installed app would then refuse the update.
      - name: Check the update is signed with the app's key
        run: |
          key_id() { base64 -d | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | xxd -p; }
          trusted=$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json | key_id)
          signed=$(key_id < target/release/bundle/macos/Chord.app.tar.gz.sig)
          test -n "$trusted" && test "$trusted" = "$signed"
      # The installed app reads this file from the latest release to learn of a newer version.
      - name: Write the update feed
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Chord.app.tar.gz" \
            --rawfile signature target/release/bundle/macos/Chord.app.tar.gz.sig \
            '{version: $version, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' > latest.json
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg target/release/bundle/macos/Chord.app.tar.gz latest.json --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
