[package]
name = "chord"
description = "A macOS workspace for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "chord_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chord-core = { version = "0.1.0", path = "../crates/chord-core" }
chord-ios = { version = "0.1.0", path = "../crates/chord-ios" }
specta = "=2.0.0-rc.28"
specta-typescript = "=0.0.15"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }

[lints]
workspace = true
